
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Task4</title>
</head>
<body>

    <button onclick="sum_numbers()">Click me</button>

    <script>
        function sum_numbers() {
            const numbers = [];

            for (let i = 0; i <= 100; i++) {
                numbers.push(i);
            }

            let sum = 0;

            for (let i = 0; i < numbers.length; i++) {
                sum += numbers[i];
            }

            console.log(sum);
        }
    </script>

</body>
</html>
