<!DOCTYPE html>
<html>
<head>
    <title>Task 10</title>
</head>
<body>

    <button onclick="get_ip()">Get ip</button>

    <script>
        function get_ip() {
            const button = document.querySelector("button");

            fetch("https://api.ipify.org/")
                .then(response => response.text())
                .then(ip => button.textContent = ip)
                .catch(error => console.error("Error:", error));
        }
    </script>

</body>
</html>
