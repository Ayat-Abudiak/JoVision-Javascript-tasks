<!DOCTYPE html>
<html>
<head>
    <title>Task9</title>
</head>
<body>

    <button onclick="get_ip()">Get ip</button>

    <script>
        function get_ip() {
            fetch("https://api.ipify.org/")
                .then(response => response.text())
                .then(ip => console.log(ip))
                .catch(error => console.error("Error:", error));
        }
    </script>

</body>
