<!DOCTYPE html>
<html>
<head>
    <title>Task11</title>
</head>
<body>

    <button onclick="get_ip()">Get ip</button>

    <script>
        const get_ip = () => {
            const button = document.querySelector("button");

            fetch(fetch("https://api.ipify.orgx/"))
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Wrong URL");
                    }

                    return response.text();
                })
                .then(ip => {
                    button.textContent = ip;
                })
                .catch(error => {
                    alert(error.message);
                });
        };
    </script>

</body>
</html>
